<script>
// Load recommendations from products.json
function slugify(text) {
  let s = String(text).toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  const MAX = 60;
  if (s.length > MAX) { const cut = s.lastIndexOf('-', MAX - 1); s = cut > 0 ? s.slice(0, cut) : s.slice(0, MAX); }
  return s;
}
function productUrl(product) {
  return '/product-detail/' + slugify(product.name) + '_' + product.id + '.html';
}
(function() {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', '/data/products.json', true);
  xhr.onload = function() {
    try {
      var products = JSON.parse(xhr.responseText);
      var shuffled = products.sort(function() { return 0.5 - Math.random(); }).slice(0, 4);
      var html = shuffled.map(function(p) {
        return '<a href="' + productUrl(p) + '" class="product-card block group">' +
          '<div class="product-image-wrap h-32">' +
          '<img src="' + p.images[0] + '" alt="' + p.name + '" loading="lazy" class="w-full h-full object-cover">' +
          '</div>' +
          '<div class="p-3">' +
          '<h3 class="font-serif font-bold text-sm group-hover:text-primary dark:group-hover:text-primary-light transition-colors line-clamp-1">' + p.name + '</h3>' +
          '<span class="text-xs font-semibold text-primary dark:text-primary-light">MOQ ' + p.moq + 'pcs</span>' +
          '</div></a>';
      }).join('');
      document.getElementById('recommendations').innerHTML = html;
    } catch(e) {
      document.getElementById('recommendations').innerHTML = '<p class="text-gray-400 col-span-full">Browse our <a href="search.html" class="text-primary hover:underline">product catalog</a>.</p>';
    }
  };
  xhr.send();
})();
</script>
