<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">Product Details — lightcirle</title>
  <meta name="description" content="View product specifications, customization options, and MOQ." id="pageDescription">
  <meta property="og:title" content="Product Details | lightcirle" id="ogTitle">
  <meta property="og:description" content="Custom yoga wear product details and specifications." id="ogDescription">
  <meta property="og:image" content="https://lightcirle.com/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:type" content="product">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Product Details | lightcirle">
  <meta name="twitter:image" content="https://lightcirle.com/og-image.jpg">
  <link rel="canonical" href="https://lightcirle.com/product-detail.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" id="siteFavicon">
  <script src="/js/config.js"></script>
  <link rel="stylesheet" href="/css/tailwind.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-cream text-gray-900 dark:bg-darkbg dark:text-gray-200 transition-colors duration-300">

<!-- Navigation -->
<nav id="mainNav" class="nav-glass fixed top-0 left-0 right-0 z-50"></nav>

<main>
<section class="pt-28 lg:pt-36 pb-16 lg:pb-24" id="productDetail">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <nav class="hidden md:flex items-center gap-2 text-sm text-gray-500 dark:text-gray-400 mb-8">
      <a href="/" class="hover:text-primary dark:hover:text-primary-light">Home</a>
      <i class="fas fa-chevron-right text-xs"></i>
      <a href="/search.html" class="hover:text-primary dark:hover:text-primary-light">Products</a>
      <i class="fas fa-chevron-right text-xs"></i>
      <span id="breadcrumbName" class="text-gray-900 dark:text-gray-200">Loading...</span>
    </nav>

    <div id="loadingState" class="animate-pulse">
      <div class="grid lg:grid-cols-2 gap-12">
        <div>
          <div class="aspect-square bg-gray-200 dark:bg-gray-700 rounded-2xl"></div>
          <div class="flex gap-3 mt-4">
            <div class="w-20 h-20 bg-gray-200 dark:bg-gray-700 rounded-xl"></div>
            <div class="w-20 h-20 bg-gray-200 dark:bg-gray-700 rounded-xl"></div>
          </div>
        </div>
        <div class="space-y-4">
          <div class="h-8 bg-gray-200 dark:bg-gray-700 rounded w-3/4"></div>
          <div class="h-4 bg-gray-200 dark:bg-gray-700 rounded w-1/2"></div>
          <div class="h-20 bg-gray-200 dark:bg-gray-700 rounded"></div>
        </div>
      </div>
    </div>

    <div id="productContent" class="hidden"></div>

    <div id="errorState" class="empty-state hidden" style="display:none;">
      <i class="fas fa-exclamation-circle"></i>
      <h3 class="text-xl font-serif font-bold mb-2">Product not found</h3>
      <p class="text-gray-500 dark:text-gray-400 mb-6" id="errorMessage">The product you're looking for doesn't exist or has been removed.</p>
      <a href="/search.html" class="btn-primary"><i class="fas fa-th-large"></i> Browse All Products</a>
    </div>
  </div>
</section>

<section id="relatedSection" class="py-16 lg:py-20 bg-white dark:bg-darksurface border-t border-gray-100 dark:border-gray-800 hidden">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <h2 class="text-2xl lg:text-3xl font-serif font-bold mb-10">Related Products</h2>
    <div id="relatedProducts" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
  </div>
</section>

<footer id="siteFooter" class="site-footer"></footer>

</main>

<div id="floatingContact" class="floating-contact"></div>
<button id="scrollTopBtn" class="scroll-top" aria-label="Scroll to top"><i class="fas fa-arrow-up"></i></button>

<script src="/js/nav.js"></script>
  <script src="/js/main.js"></script>
<script src="/js/visitor-tracker.js"></script>
<script>
(function() {
  // --- Parse product ID from URL ---
  // New format: /product-detail/{slug}_{productId}.html (Alibaba-style)
  // Legacy format: /product-detail.html?id={productId} (still supported for old links)
  var productId = null;
  var pathMatch = window.location.pathname.match(/\/product-detail\/(.+?)_(.+)\.html$/);
  if (pathMatch && pathMatch[2]) {
    productId = pathMatch[2]; // real ID is after the last underscore
  } else {
    productId = new URLSearchParams(window.location.search).get('id');
  }
  if (!productId) { window.location.href = '/search.html'; return; }

  var loadingEl = document.getElementById('loadingState');
  var contentEl = document.getElementById('productContent');
  var errorEl = document.getElementById('errorState');
  var errorMsg = document.getElementById('errorMessage');

  function showError(msg) {
    if (loadingEl) loadingEl.style.display = 'none';
    if (contentEl) { contentEl.classList.add('hidden'); }
    if (errorEl) {
      if (errorMsg && msg) errorMsg.textContent = msg;
      errorEl.style.display = '';
      errorEl.classList.remove('hidden');
    }
  }

  var categoryNames = {
    'yoga-pants': 'Yoga Pants',
    'sports-bras': 'Sports Bras',
    'yoga-outerwear': 'Yoga Outerwear',
    'hoodies': 'Hoodies',
    'sets': 'Matching Sets',
    'seamless': 'Seamless'
  };

  // Refresh the live category name label from backend (falls back to the hardcoded map above if API unavailable).
  // Shows the full two-level path "Parent / Child" when the product's category has a parent.
  window.refreshProductCategoryName = function() {
    try {
      fetch(window.location.origin + '/api/categories?type=product')
        .then(function(r) { return r.ok ? r.json() : null; })
        .then(function(cats) {
          if (!Array.isArray(cats)) return;
          var byId = {};
          cats.forEach(function(c) { categoryNames[c.id] = c.name; byId[c.id] = c; });
          function pathOf(id) {
            var c = byId[id];
            if (!c) return id;
            if (c.parent_id && c.parent_id !== '' && byId[c.parent_id]) return c.parent_id + ' / ' + c.id;
            return c.id;
          }
          var p = window.__currentProduct;
          if (!p) return;
          var el = document.getElementById('productCategoryLabel');
          if (el) el.textContent = pathOf(p.category);
        })
        .catch(function() {});
    } catch (e) {}
  };

  function slugify(text) {
    let s = String(text).toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  const MAX = 60;
  if (s.length > MAX) { const cut = s.lastIndexOf('-', MAX - 1); s = cut > 0 ? s.slice(0, cut) : s.slice(0, MAX); }
  return s;
  }

  // ===== Video helpers (shared with blog-detail) =====
  function isVideoEmbed(url) {
    return /youtube\.com|youtu\.be|bilibili\.com/i.test(url || '');
  }
  function videoEmbedSrc(url) {
    // Normalize YouTube / Bilibili into embeddable iframe src
    if (/youtu\.be\//i.test(url)) {
      var id = url.split('youtu.be/')[1].split(/[?#]/)[0];
      return 'https://www.youtube.com/embed/' + id;
    }
    if (/youtube\.com\/watch/i.test(url)) {
      var m = url.match(/[?&]v=([^&]+)/);
      if (m) return 'https://www.youtube.com/embed/' + m[1];
    }
    if (/bilibili\.com\/video\/BV/i.test(url)) {
      var bv = url.match(/BV[a-zA-Z0-9]+/);
      if (bv) return 'https://player.bilibili.com/player.html?bvid=' + bv[0] + '&autoplay=0';
    }
    return url; // assume already embeddable
  }
  function renderVideoBlock(url, extraClass) {
    if (isVideoEmbed(url)) {
      return '<div class="' + (extraClass || '') + ' w-full h-full rounded-2xl overflow-hidden bg-black">' +
        '<iframe src="' + videoEmbedSrc(url) + '" class="w-full h-full" allowfullscreen allow="autoplay; encrypted-media"></iframe></div>';
    }
    return '<div class="' + (extraClass || '') + ' w-full h-full rounded-2xl overflow-hidden bg-gray-100 dark:bg-gray-800">' +
      '<video src="' + url + '" autoplay muted loop playsinline controls class="w-full h-full object-cover"></video></div>';
  }

  function articleUrlSafe(article) {
    return '/blog-detail/' + slugify(article.title) + '_' + article.id + '.html';
  }

  function productUrl(product) {
    return '/product-detail/' + slugify(product.name) + '_' + product.id + '.html';
  }

  // ===== Factory capability card (independent-site layout) — under the left image carousel =====
  // Driven by /api/company.factoryCard. Independent-site context: instead of marketplace
  // trading metrics (store rating, on-time dispatch rate, reorder rate) we surface the
  // factory's real manufacturing promises: response time, sampling/lead time, MOQ, monthly
  // capacity, plus a chip list of customization capabilities. The card does NOT include a
  // CTA button — the global sticky contact bar already covers conversion.
  // Mobile: drop the 4-column metrics, keep header + 2-3 capability chips for a compact card.
  function renderFactoryCard() {
    var fc = (window.__companyData && window.__companyData.factoryCard) || {};
    // Require at minimum a company name or a tagline or a highlight — otherwise don't render
    if (!fc.name && !fc.tagline && !fc.highlight) return '';
    var isMobile = window.innerWidth < 768;

    // Header: logo + name + tagline
    var logoHtml = fc.logo
      ? '<img class="fc-logo" src="' + escAttr(fc.logo) + '" alt="' + escHtml(fc.name || 'factory logo') + '" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'"><span class="fc-logo-fallback" style="display:none"><i class="fas fa-industry"></i></span>'
      : '<span class="fc-logo-fallback"><i class="fas fa-industry"></i></span>';
    var headerHtml =
      '<div class="fc-header">' +
        '<div class="fc-logo-wrap">' + logoHtml + '</div>' +
        '<div class="fc-id">' +
          '<div class="fc-name-row">' +
            '<span class="fc-name">' + escHtml(fc.name || '') + '</span>' +
          '</div>' +
          (fc.tagline ? '<p class="fc-tagline">' + escHtml(fc.tagline) + '</p>' : '') +
        '</div>' +
      '</div>';

    // Meta line: location + years
    var metaBits = [];
    if (fc.location) metaBits.push('<span><i class="fas fa-map-marker-alt fc-meta-icon"></i>' + escHtml(fc.location) + '</span>');
    if (fc.years) metaBits.push('<span><i class="fas fa-calendar fc-meta-icon"></i>' + escHtml(fc.years) + '</span>');
    var metaHtml = metaBits.length ? '<div class="fc-meta-line">' + metaBits.join('<span class="fc-meta-sep">·</span>') + '</div>' : '';

    // Highlight pill (core promise, e.g. "MOQ 50pcs · 15-Day Sampling") — left aligned inline pill
    var highlightHtml = fc.highlight ? '<div class="fc-highlight"><i class="fas fa-bolt"></i>' + escHtml(fc.highlight) + '</div>' : '';

    // 4-column metrics — only render on desktop to keep the card compact on mobile
    var metrics = [
      { v: fc.responseTime, l: 'Response' },
      { v: fc.leadTime, l: 'Lead Time' },
      { v: fc.moq, l: 'MOQ' },
      { v: fc.monthlyCapacity, l: 'Capacity/mo' }
    ];
    var metricsHtml = '';
    if (!isMobile) {
      metricsHtml = '<div class="fc-metrics">' +
        metrics.map(function(m) {
          return m.v ? '<div class="fc-metric"><div class="fc-metric-val">' + escHtml(m.v) + '</div><div class="fc-metric-label">' + escHtml(m.l) + '</div></div>' : '';
        }).join('') +
      '</div>';
    }

    // Capabilities chip list (truncate on mobile to keep card compact)
    var caps = Array.isArray(fc.capabilities) ? fc.capabilities : [];
    var capIcons = ['fa-pen-nib', 'fa-drafting-compass', 'fa-fill-drip', 'fa-tag', 'fa-box', 'fa-tshirt', 'fa-print', 'fa-palette'];
    var visibleCaps = isMobile ? caps.slice(0, 3) : caps.slice(0, 6);
    var capHtml = visibleCaps.length ? (
      '<div class="fc-capabilities">' +
        visibleCaps.map(function(c, i) {
          return '<span class="fc-cap-chip"><i class="fas ' + (capIcons[i] || 'fa-check') + '"></i>' + escHtml(c) + '</span>';
        }).join('') +
        (caps.length > visibleCaps.length ? '<span class="fc-cap-more">+' + (caps.length - visibleCaps.length) + '</span>' : '') +
      '</div>'
    ) : '';

    return '<div class="factory-card mt-4">' + headerHtml + metaHtml + highlightHtml + metricsHtml + capHtml + '</div>';
  }
  // Minimal HTML escapers used by renderFactoryCard
  function escHtml(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function escAttr(s) { return escHtml(s).replace(/"/g,'&quot;'); }

  function renderProduct(product) {
    document.title = product.name + ' — Custom Yoga Wear | MOQ ' + product.moq + 'pcs | lightcirle';
    document.getElementById('pageTitle').textContent = document.title;
    var desc = document.querySelector('meta[name="description"]');
    if (desc) desc.setAttribute('content', product.name + ': ' + product.description.substring(0, 150) + '... MOQ ' + product.moq + 'pcs.');

    var html = '<div class="pd-detail-grid">';
    // Images / Video (Alibaba-style: video replaces first main image when present)
    var hasVideo = !!(product.video && product.video.trim());
    var mainImgSrc = (product.images && product.images.length) ? product.images[0] : '';
    // New layout: main square (420x420) on top with L/R arrows overlaid, carousel thumbnails row with L/R arrows below.
    html += '<div class="flex flex-col items-center lg:items-start">';
    // Main media (square 420x420, responsive) with prev/next arrows overlaid
    html += '<div class="pd-main-media relative w-full rounded-2xl overflow-hidden bg-gray-100 dark:bg-gray-800 select-none group" id="mainMedia">';
    if (hasVideo) {
      html += renderVideoBlock(product.video);
    } else if (mainImgSrc) {
      html += '<img src="' + mainImgSrc + '" alt="' + product.name + '" id="mainImage" class="w-full h-full object-cover">';
    }
    html += '<button type="button" onclick="prevImage()" class="main-image-arrow main-image-arrow-left" aria-label="Previous image"><i class="fas fa-chevron-left"></i></button>';
    html += '<button type="button" onclick="nextImage()" class="main-image-arrow main-image-arrow-right" aria-label="Next image"><i class="fas fa-chevron-right"></i></button>';
    html += '</div>';
    // Carousel thumbnails — arrows are absolutely positioned on top of the strip (L/R edges, vertically centered)
    html += '<div class="relative mt-4 w-full pd-thumb-wrap">';
    html += '<div id="thumbStrip" class="flex gap-3 overflow-x-auto scrollbar-hide snap-x snap-mandatory px-12">';
    // Thumbnail 0: video (if any)
    if (hasVideo) {
      html += '<button data-idx="-1" onclick="renderMainMedia(\'video\')" class="thumb-item w-20 h-20 flex-shrink-0 rounded-xl overflow-hidden border-2 border-primary hover:border-primary/50 transition-colors relative bg-black flex items-center justify-center snap-start">' +
        '<i class="fas fa-play text-white/80 text-lg"></i>' +
        '<span class="absolute bottom-0.5 left-0.5 w-4 h-4 rounded-full bg-white/80 text-[#2D5A3D] text-[8px] flex items-center justify-center"><i class="fas fa-film"></i></span></button>';
    }
    for (var i = 0; i < product.images.length; i++) {
      var border = (!hasVideo && i === 0) ? 'border-primary' : 'border-transparent';
      html += '<button data-idx="' + i + '" onclick="renderMainMedia(' + i + ')" class="thumb-item w-20 h-20 flex-shrink-0 rounded-xl overflow-hidden border-2 ' + border + ' hover:border-primary/50 transition-colors snap-start"><img src="' + product.images[i] + '" alt="' + product.name + ' view ' + (i+1) + '" class="w-full h-full object-cover"></button>';
    }
    html += '</div>';
    html += '<button type="button" onclick="scrollThumbs(-1)" class="thumb-arrow thumb-arrow-overlay thumb-arrow-left" aria-label="Previous thumbnails"><i class="fas fa-chevron-left"></i></button>';
    html += '<button type="button" onclick="scrollThumbs(1)" class="thumb-arrow thumb-arrow-overlay thumb-arrow-right" aria-label="Next thumbnails"><i class="fas fa-chevron-right"></i></button>';
    html += '</div>';
    // Factory card (Alibaba-style supplier card) under the image carousel — only if data present
    html += renderFactoryCard();
    html += '</div>';
    html += '<div>';
    // Title: clamp to 2 lines (no Read more button)
    html += '<h1 id="productTitle" class="pd-title font-serif font-bold mb-4">' + product.name + '</h1>';
    // Long description: clamp to 3 lines (no Read more button)
    var descText = product.description || '';
    html += '<div class="mb-4">';
    html += '<p id="productDesc" class="pd-desc text-gray-600 dark:text-gray-400">' + descText + '</p>';
    html += '</div>';
    // Certifications: single-line row directly below the description, NO heading
    if (product.certifications && product.certifications.length) {
      html += '<div class="mb-6 flex flex-nowrap gap-2 overflow-hidden">';
      for (var ci = 0; ci < product.certifications.length; ci++) {
        html += '<span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-primary/5 dark:bg-primary-light/10 text-primary dark:text-primary-light text-xs font-medium border border-primary/20 dark:border-primary-light/20 whitespace-nowrap flex-shrink-0"><i class="fas fa-certificate"></i>' + product.certifications[ci] + '</span>';
      }
      html += '</div>';
    }
    // Price range (text only — no tiered pricing exposed; guides inquiry)
    if (product.priceRange && product.priceRange.trim()) {
      html += '<p class="text-sm text-gray-500 dark:text-gray-400 mb-6"><i class="fas fa-tags pd-price-icon text-primary dark:text-primary-light"></i>' + product.priceRange + '</p>';
    }
    // Specs
    html += '<div class="grid grid-cols-2 gap-4 mb-8">';
    html += '<div class="bg-gray-50 dark:bg-gray-800/50 rounded-xl p-4"><p class="text-xs text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-1">MOQ</p><p class="font-bold text-sm">' + product.moq + ' pcs</p></div>';
    html += '<div class="bg-gray-50 dark:bg-gray-800/50 rounded-xl p-4"><p class="text-xs text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-1">Lead Time</p><p class="font-bold text-sm">' + product.leadTime + '</p></div>';
    html += '<div class="bg-gray-50 dark:bg-gray-800/50 rounded-xl p-4"><p class="text-xs text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-1">Fabric</p><p class="font-bold text-sm">' + product.fabric + '</p></div>';
    html += '<div class="bg-gray-50 dark:bg-gray-800/50 rounded-xl p-4"><p class="text-xs text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-1">Weight</p><p class="font-bold text-sm">' + product.weight + '</p></div>';
    html += '</div>';
    // Sizes
    html += '<div class="mb-6"><p class="text-sm font-semibold mb-2">Available Sizes</p><div class="flex flex-wrap gap-2">';
    for (var s = 0; s < product.sizes.length; s++) {
      html += '<span class="px-3 py-1 rounded-md border border-gray-200 dark:border-gray-700 text-sm">' + product.sizes[s] + '</span>';
    }
    html += '</div></div>';
    // Colors
    html += '<div class="mb-6"><p class="text-sm font-semibold mb-2">Available Colors</p><div class="flex flex-wrap gap-2">';
    for (var c = 0; c < product.colors.length; c++) {
      html += '<span class="px-3 py-1 rounded-full bg-gray-100 dark:bg-gray-800 text-sm">' + product.colors[c] + '</span>';
    }
    html += '</div></div>';
    // Features
    html += '<div class="mb-6"><p class="text-sm font-semibold mb-2">Key Features</p><div class="flex flex-wrap gap-2">';
    for (var f = 0; f < product.features.length; f++) {
      html += '<span class="px-3 py-1 rounded-[6px] bg-accent/10 dark:bg-accent-light/10 text-accent dark:text-accent-light text-sm font-medium"><i class="fas fa-check mr-1"></i>' + product.features[f] + '</span>';
    }
    html += '</div></div>';
    // CTA
    html += '<div class="flex flex-wrap gap-4 pt-4 border-t border-gray-200 dark:border-gray-700">';
    html += '<a href="https://wa.me/8612345678900?text=Hi!%20I%27m%20interested%20in%20' + encodeURIComponent(product.name) + '" target="_blank" rel="noopener" class="btn-whatsapp flex-1 sm:flex-none justify-center"><i class="fab fa-whatsapp"></i> Inquire on WhatsApp</a>';
    html += '<a href="mailto:inquiry@lightcirle.com?subject=Inquiry%20-%20' + encodeURIComponent(product.name) + '" class="btn-outline flex-1 sm:flex-none justify-center"><i class="fas fa-envelope"></i> Send Email</a>';
    html += '</div></div></div>';

    // Customization
    html += '<div id="customizationSection" class="mt-16 p-8 lg:p-12 rounded-2xl bg-white dark:bg-darksurface border border-gray-100 dark:border-gray-800">';
    html += '<h2 class="text-2xl font-serif font-bold mb-6">Customization Options</h2><div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">';
    for (var cust = 0; cust < product.customization.length; cust++) {
      html += '<div class="flex items-center gap-3 p-4 rounded-xl bg-gray-50 dark:bg-gray-800/50"><div class="w-10 h-10 rounded-full bg-primary/10 dark:bg-primary-light/10 flex items-center justify-center flex-shrink-0"><i class="fas fa-check text-primary dark:text-primary-light"></i></div><span class="text-sm font-medium">' + product.customization[cust] + '</span></div>';
    }
    html += '</div></div>';

    // Process
    html += '<div class="mt-12"><h2 class="text-2xl font-serif font-bold mb-8 text-center">Customization Process</h2><div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-6">';
    var steps = [
      {icon:'fa-comments',title:'1. Consult',desc:'Tell us your requirements via WhatsApp or email'},
      {icon:'fa-pencil-ruler',title:'2. Design',desc:'We create tech packs and samples for your approval'},
      {icon:'fa-industry',title:'3. Produce',desc:'Manufacturing with quality control (15-25 days)'},
      {icon:'fa-shipping-fast',title:'4. Deliver',desc:'Global shipping to your doorstep'}
    ];
    for (var st = 0; st < steps.length; st++) {
      html += '<div class="text-center p-6"><div class="w-14 h-14 rounded-2xl bg-' + (st%2===0?'primary':'accent') + '/10 dark:bg-' + (st%2===0?'primary-light':'accent-light') + '/10 flex items-center justify-center mx-auto mb-4"><i class="fas ' + steps[st].icon + ' text-xl text-' + (st%2===0?'primary':'accent') + ' dark:text-' + (st%2===0?'primary-light':'accent-light') + '"></i></div><h3 class="font-bold mb-2">' + steps[st].title + '</h3><p class="text-sm text-gray-500 dark:text-gray-400">' + steps[st].desc + '</p></div>';
    }
    html += '</div></div>';

    // Add factory capabilities + related articles section after customization
    html += '<div id="factoryKnowledgeSection">' + renderFactoryKnowledgeSection(product) + '</div>';

    contentEl.innerHTML = html;
    document.getElementById('breadcrumbName').textContent = product.name;
    if (loadingEl) loadingEl.style.display = 'none';
    contentEl.classList.remove('hidden');
    window.__renderedProduct = product;
    window.__currentProduct = product;
    if (window.setStickyProduct) window.setStickyProduct(product.name, (product.images && product.images[0]) ? product.images[0] : '');
    // Update canonical URL with slug
    var canonLink = document.querySelector('link[rel="canonical"]');
    if (canonLink) canonLink.setAttribute('href', 'https://lightcirle.com' + productUrl(product));
    // Inject Product + Breadcrumb schema
    if (window.injectProductSchema) injectProductSchema(product);
    if (window.injectBreadcrumbSchema) injectBreadcrumbSchema([
      { name: 'Home', url: '/' },
      { name: 'Explore', url: '/search.html' },
      { name: product.name, url: productUrl(product) }
    ]);
  }

  // Track the currently-shown media index so prev/next can wrap correctly.
  // -1 means the video block (only relevant when product.video exists).
  window.__currentImageIndex = 0;

  // ===== Switch main media (video / image) on thumbnail click =====
  window.renderMainMedia = function(index) {
    var p = window.__currentProduct;
    if (!p) return;
    window.__currentImageIndex = (index === 'video') ? -1 : Number(index);
    var mainMedia = document.getElementById('mainMedia');
    if (!mainMedia) return;
    if (index === 'video') {
      mainMedia.innerHTML = renderVideoBlock(p.video) +
        '<button type="button" onclick="prevImage()" class="main-image-arrow main-image-arrow-left" aria-label="Previous image"><i class="fas fa-chevron-left"></i></button>' +
        '<button type="button" onclick="nextImage()" class="main-image-arrow main-image-arrow-right" aria-label="Next image"><i class="fas fa-chevron-right"></i></button>';
    } else {
      var img = (p.images && p.images[index]) ? p.images[index] : '';
      mainMedia.innerHTML = '<img src="' + img + '" alt="' + p.name + '" class="w-full h-full object-cover">' +
        '<button type="button" onclick="prevImage()" class="main-image-arrow main-image-arrow-left" aria-label="Previous image"><i class="fas fa-chevron-left"></i></button>' +
        '<button type="button" onclick="nextImage()" class="main-image-arrow main-image-arrow-right" aria-label="Next image"><i class="fas fa-chevron-right"></i></button>';
    }
    // highlight the active thumbnail
    var thumbs = document.querySelectorAll('#thumbStrip [data-idx]');
    thumbs.forEach(function(t) {
      var active = (String(t.getAttribute('data-idx')) === String(index));
      t.classList.toggle('border-primary', active);
      t.classList.toggle('border-transparent', !active);
    });
  };

  // ===== Scroll the thumbnail carousel strip (left/right arrows) =====
  window.scrollThumbs = function(dir) {
    var strip = document.getElementById('thumbStrip');
    if (!strip) return;
    var amount = strip.clientWidth > 0 ? Math.round(strip.clientWidth * 0.8) : 100;
    strip.scrollBy({ left: dir * amount, behavior: 'smooth' });
  };

  // ===== Cycle through images with the L/R arrows overlaid on the main image =====
  // Only cycles through images (skipping video). If currently on video, prev/next jump to last/first image.
  window.prevImage = function() {
    var p = window.__currentProduct;
    if (!p || !p.images || !p.images.length) return;
    var n = p.images.length;
    var cur = window.__currentImageIndex;
    if (cur === -1) { renderMainMedia(n - 1); return; }
    renderMainMedia((cur - 1 + n) % n);
  };
  window.nextImage = function() {
    var p = window.__currentProduct;
    if (!p || !p.images || !p.images.length) return;
    var n = p.images.length;
    var cur = window.__currentImageIndex;
    if (cur === -1) { renderMainMedia(0); return; }
    renderMainMedia((cur + 1) % n);
  };

  // ===== Factory Strength & Related Knowledge Module =====
  function renderFactoryKnowledgeSection(product) {
    var data = window.__companyData || {};
    var aboutTitle = data.aboutTitle || 'The Manufacturing Powerhouse Behind Your Brand';
    var aboutText = data.aboutText || 'Since 2016, our 3,000m² facility in Guangzhou has been producing premium yoga wear for brands worldwide. With 120+ skilled technicians and a monthly capacity of 300,000 pieces, we bring your designs to life with precision and care.';
    var stats = data.stats || {};
    var capabilities = data.capabilities || ['OEM & ODM Service', 'Custom Fabric Blends', 'Pantone Color Matching', 'Logo Embroidery', 'Custom Labels & Tags', 'Branded Packaging', 'OEKO-TEX Certified', 'AQL 2.5 QC'];
    var gallery = data.gallery || [];

    var factoryHtml = '';

    // --- Factory Capabilities (compact) ---
    factoryHtml += '<div class="mt-16 bg-white dark:bg-darksurface rounded-2xl border border-gray-100 dark:border-gray-800 overflow-hidden">';
    factoryHtml += '<div class="grid lg:grid-cols-3">';

    // Left: Factory intro
    factoryHtml += '<div class="lg:col-span-2 p-8 lg:p-10">';
    factoryHtml += '<span class="inline-block px-3 py-1 rounded-full text-xs font-semibold bg-primary/10 dark:bg-primary-light/20 text-primary dark:text-primary-light uppercase tracking-wider mb-4">Our Factory</span>';
    factoryHtml += '<h2 class="text-2xl lg:text-3xl font-serif font-bold mb-4">' + aboutTitle + '</h2>';
    factoryHtml += '<p class="text-gray-600 dark:text-gray-400 mb-6">' + aboutText + '</p>';

    // Factory stats row
    factoryHtml += '<div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6">';
    factoryHtml += '<div class="bg-cream dark:bg-gray-800/40 rounded-xl p-3 text-center"><div class="text-xl font-serif font-bold text-primary dark:text-primary-light">' + (stats.facilitySize || '3,000') + '</div><p class="text-xs text-gray-500">m² Facility</p></div>';
    factoryHtml += '<div class="bg-cream dark:bg-gray-800/40 rounded-xl p-3 text-center"><div class="text-xl font-serif font-bold text-primary dark:text-primary-light">' + (stats.workers || '120+') + '</div><p class="text-xs text-gray-500">Workers</p></div>';
    factoryHtml += '<div class="bg-cream dark:bg-gray-800/40 rounded-xl p-3 text-center"><div class="text-xl font-serif font-bold text-primary dark:text-primary-light">' + (stats.monthlyCapacity || '300K') + '</div><p class="text-xs text-gray-500">Monthly Pcs</p></div>';
    factoryHtml += '<div class="bg-cream dark:bg-gray-800/40 rounded-xl p-3 text-center"><div class="text-xl font-serif font-bold text-primary dark:text-primary-light">' + (stats.countriesShipped || '30+') + '</div><p class="text-xs text-gray-500">Countries</p></div>';
    factoryHtml += '</div>';

    // Factory image gallery — horizontal scrollable row (from API or fallback)
    var galleryFiles = gallery.length > 0 ? gallery : ['assets/images/factory/1.jpg','assets/images/factory/2.jpg','assets/images/factory/3.jpg','assets/images/factory/4.jpg','assets/images/factory/5.jpg','assets/images/factory/6.jpg','assets/images/factory/7.jpg','assets/images/factory/8.jpg'];
    factoryHtml += '<div class="mb-6">';
    factoryHtml += '<div class="flex gap-3 overflow-x-auto pb-2 snap-x snap-mandatory scrollbar-hide" style="scrollbar-width:none;-ms-overflow-style:none;scroll-snap-type:x mandatory">';
    for (var fi2 = 0; fi2 < galleryFiles.length; fi2++) {
      factoryHtml += '<div class="flex-shrink-0 w-[200px] snap-start rounded-xl overflow-hidden aspect-[4/3] bg-gray-100 dark:bg-gray-800"><img src="' + galleryFiles[fi2] + '" alt="Factory photo" class="w-full h-full object-cover hover:scale-105 transition-transform duration-500" loading="lazy"></div>';
    }
    factoryHtml += '</div>';
    factoryHtml += '<div class="flex justify-center gap-1.5 mt-2">';
    for (var fi3 = 0; fi3 < galleryFiles.length; fi3++) {
      factoryHtml += '<span class="w-1.5 h-1.5 rounded-full bg-gray-300 dark:bg-gray-600 scroll-dot"></span>';
    }
    factoryHtml += '</div></div><style>.scrollbar-hide::-webkit-scrollbar{display:none}</style>';

    // Capability tags
    factoryHtml += '<div class="flex flex-wrap gap-2">';
    for (var cp = 0; cp < Math.min(capabilities.length, 8); cp++) {
      factoryHtml += '<span class="text-xs px-3 py-1 rounded-full bg-primary/5 dark:bg-primary-light/10 text-primary dark:text-primary-light border border-primary/20 dark:border-primary-light/20"><i class="fas fa-check mr-1"></i>' + capabilities[cp] + '</span>';
    }
    factoryHtml += '</div></div>';

    // Right: CTA with WhatsApp
    factoryHtml += '<div class="p-8 lg:p-10 bg-primary/5 dark:bg-gray-800/30 flex flex-col justify-center border-t lg:border-t-0 lg:border-l border-gray-100 dark:border-gray-800">';
    factoryHtml += '<div class="w-14 h-14 rounded-2xl bg-primary/10 dark:bg-primary-light/10 flex items-center justify-center mb-4"><i class="fas fa-industry text-2xl text-primary dark:text-primary-light"></i></div>';
    factoryHtml += '<h3 class="font-serif font-bold text-lg mb-2">Start Your Project</h3>';
    factoryHtml += '<p class="text-sm text-gray-500 dark:text-gray-400 mb-6">Talk to our team about customizing this product for your brand. Free consultation.</p>';
    factoryHtml += '<a href="https://wa.me/8612345678900?text=Hi!%20I%27m%20interested%20in%20' + encodeURIComponent(product.name) + '" target="_blank" rel="noopener" class="btn-whatsapp justify-center text-sm mb-3"><i class="fab fa-whatsapp"></i> WhatsApp Us</a>';
    factoryHtml += '<a href="mailto:inquiry@lightcirle.com?subject=Inquiry%20-%20' + encodeURIComponent(product.name) + '" class="btn-outline text-sm justify-center"><i class="fas fa-envelope"></i> Send Email</a>';
    factoryHtml += '</div></div></div>';

    // --- Related Knowledge (if blog data loaded) ---
    if (window.__relatedArticles && window.__relatedArticles.length > 0) {
      factoryHtml += '<div class="mt-10">';
      factoryHtml += '<div class="flex items-center justify-between mb-6"><h3 class="text-xl font-serif font-bold">Related Knowledge</h3><a href="/search.html?tab=blog" class="text-sm text-primary dark:text-primary-light hover:underline">View All →</a></div>';
      factoryHtml += '<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">';
      for (var ra = 0; ra < Math.min(window.__relatedArticles.length, 3); ra++) {
        var art = window.__relatedArticles[ra];
        factoryHtml += '<a href="' + articleUrlSafe(art) + '" class="block bg-gray-50 dark:bg-gray-800/40 rounded-xl p-4 hover:bg-primary/5 dark:hover:bg-primary-light/5 transition-colors group">';
        factoryHtml += '<span class="text-xs font-semibold text-accent uppercase tracking-wider">' + (art.category) + '</span>';
        factoryHtml += '<h4 class="font-bold text-sm mt-1 group-hover:text-primary dark:group-hover:text-primary-light transition-colors line-clamp-2">' + art.title + '</h4>';
        factoryHtml += '<p class="text-xs text-gray-500 dark:text-gray-400 mt-1 line-clamp-2">' + (art.excerpt || '') + '</p>';
        factoryHtml += '<span class="text-xs text-primary dark:text-primary-light mt-2 inline-block group-hover:underline">Read More →</span>';
        factoryHtml += '</a>';
      }
      factoryHtml += '</div></div>';
    }

    // --- FAQs (driven by /api/company.faqs) ---
    var faqs = Array.isArray(data.faqs) ? data.faqs.filter(function(f) { return (f && ((f.q || '').trim() || (f.a || '').trim())); }) : [];
    if (faqs.length) {
      factoryHtml += '<div id="faqsSection" class="mt-12">';
      factoryHtml += '<h2 class="text-2xl font-serif font-bold mb-6">FAQs</h2>';
      factoryHtml += '<div class="bg-gray-50 dark:bg-gray-800/40 rounded-2xl border border-gray-100 dark:border-gray-800 px-6 py-2">';
      for (var fi = 0; fi < faqs.length; fi++) {
        var item = faqs[fi];
        factoryHtml += '<div class="py-4' + (fi < faqs.length - 1 ? ' border-b border-gray-200 dark:border-gray-700' : '') + '">';
        factoryHtml += '<h3 class="font-bold text-sm sm:text-base mb-2 text-gray-900 dark:text-gray-100">' + escHtml(item.q || '') + '</h3>';
        factoryHtml += '<p class="text-sm text-gray-600 dark:text-gray-400 leading-relaxed">' + escHtml(item.a || '') + '</p>';
        factoryHtml += '</div>';
      }
      factoryHtml += '</div></div>';
    }

    return factoryHtml;
  }

  function renderRelated(products, currentId) {
    var related = [];
    for (var i = 0; i < products.length; i++) {
      if (products[i].id !== currentId && related.length < 4) {
        related.push(products[i]);
      }
    }
    if (related.length === 0) { document.getElementById('relatedSection').classList.add('hidden'); return; }
    document.getElementById('relatedSection').classList.remove('hidden');
    var html = '';
    for (var r = 0; r < related.length; r++) {
      html += '<a href="' + productUrl(related[r]) + '" class="product-card block"><div class="product-image-wrap"><img src="' + related[r].images[0] + '" alt="' + related[r].name + '" loading="lazy"></div><div class="p-4"><h3 class="font-serif font-bold text-base mb-1">' + related[r].name + '</h3><span class="text-xs font-semibold text-primary dark:text-primary-light">MOQ ' + related[r].moq + 'pcs</span></div></a>';
    }
    document.getElementById('relatedProducts').innerHTML = html;
  }

  // ===== Article category names for related knowledge =====
  window.__articleCatNames = {
    'fabric-knowledge': 'Fabric Knowledge',
    'business-tips': 'Business Tips',
    'industry-news': 'Industry News'
  };

  // ===== Article <-> Product relevance mapping (keyed by product ID prefix) =====
  var productArticleRelevance = {
    'leggings': ['fabric-guide-01', 'moq-guide-02', 'yoga-wear-trends-2026-04'],
    'bra': ['fabric-guide-01', 'customization-process-03', 'private-label-05'],
    'outerwear': ['customization-process-03', 'private-label-05', 'moq-guide-02'],
    'hoodie': ['customization-process-03', 'private-label-05', 'moq-guide-02'],
    'set': ['yoga-wear-trends-2026-04', 'customization-process-03', 'moq-guide-02'],
    'seamless': ['yoga-wear-trends-2026-04', 'fabric-guide-01', 'moq-guide-02']
  };

  // Load company data for factory section
  var companyXhr = new XMLHttpRequest();
  companyXhr.open('GET', '/api/company', true);
  companyXhr.onload = function() {
    try {
      window.__companyData = JSON.parse(companyXhr.responseText);
      // If product already rendered, re-render the factory section + the factory card
      var existingSection = document.getElementById('factoryKnowledgeSection');
      if (existingSection && window.__renderedProduct) {
        existingSection.innerHTML = renderFactoryKnowledgeSection(window.__renderedProduct);
      }
      // Re-render the factory card by re-running renderProduct (it will read __companyData)
      if (window.__renderedProduct) {
        var imgCol = document.querySelector('.pd-detail-grid > .flex.flex-col');
        if (imgCol) {
          // Find the existing factory card (the one immediately before the right column opens)
          // and refresh it. renderProduct() rebuilds the whole left column, but we only need
          // to swap the .factory-card node.
          var tmp = document.createElement('div');
          tmp.innerHTML = renderFactoryCard();
          var oldCard = imgCol.querySelector('.factory-card');
          if (oldCard) {
            if (tmp.firstChild) imgCol.replaceChild(tmp.firstChild, oldCard);
            else oldCard.parentNode.removeChild(oldCard);
          } else if (tmp.firstChild) {
            // Card wasn't there originally (company data wasn't ready) — append it
            imgCol.appendChild(tmp.firstChild);
          }
        }
      }
    } catch(e) { /* silently skip */ }
  };
  companyXhr.send();

  // Load blog data for related articles
  var blogXhr = new XMLHttpRequest();
  blogXhr.open('GET', '/data/blog.json', true);
  blogXhr.onload = function() {
    try {
      var allArticles = JSON.parse(blogXhr.responseText);
      var relevant = productArticleRelevance[productId.split('-')[0]] || [];
      if (relevant.length > 0) {
        window.__relatedArticles = [];
        for (var ri = 0; ri < allArticles.length; ri++) {
          for (var rj = 0; rj < relevant.length; rj++) {
            if (allArticles[ri].id === relevant[rj]) {
              window.__relatedArticles.push(allArticles[ri]);
              break;
            }
          }
        }
        // Re-render factory section if product is already rendered
        var existingSection = document.getElementById('factoryKnowledgeSection');
        if (existingSection && window.__renderedProduct) {
          existingSection.innerHTML = renderFactoryKnowledgeSection(window.__renderedProduct);
        }
      }
    } catch(e) { /* silently skip if blog data fails */ }
  };
  blogXhr.send();

  // Load data and render
  var xhr = new XMLHttpRequest();
  xhr.open('GET', '/data/products.json', true);
  xhr.onload = function() {
    try {
      var products = JSON.parse(xhr.responseText);
      var product = null;
      for (var i = 0; i < products.length; i++) {
        if (products[i].id === productId) { product = products[i]; break; }
      }
      if (!product) {
        showError('Product "' + productId + '" not found in catalog. Please browse available products.');
        return;
      }
      renderProduct(product);
      renderRelated(products, productId);
    } catch(e) {
      showError('Failed to load product data: ' + e.message);
    }
  };
  xhr.onerror = function() {
    showError('Unable to connect to server. Please try again.');
  };
  xhr.send();
})();
</script>
  <script src="/js/footer.js"></script>
</body>
