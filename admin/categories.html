<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分类管理 — lightcirle 管理后台</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/tailwind.css">
  <script src="/admin/js/media-picker.js"></script>
  <link rel="stylesheet" href="/admin/css/admin-sidebar.css">
  <script defer src="/admin/js/admin-sidebar.js"></script>
  <style>body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }</style>
</head>
<body class="bg-[#FAFAF8]">
<div class="flex min-h-screen">
    <!-- Sidebar：菜单由 admin/js/admin-sidebar.js 注入，单一数据源 -->
    <aside id="adminSidebar">
      <div class="sb-brand"><a href="dashboard.html">lightcirle</a><p>管理后台</p></div>
      <nav id="adminNav" class="sb-nav"></nav>
      <div class="sb-foot">
        <a href="#" id="logoutBtn" class="sb-link logout"><i class="fas fa-sign-out-alt w-5"></i>退出登录</a>
      </div>
    </aside>
  <main id="adminMain" class="flex-1 p-6 lg:p-8">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-serif font-bold">分类管理</h1>
      <button onclick="openEditor()" class="bg-[#2D5A3D] text-white px-5 py-2.5 rounded-xl text-sm font-semibold hover:bg-[#3E7B54] transition-colors"><i class="fas fa-plus mr-1"></i> 新增分类</button>
    </div>

    <!-- Type tabs -->
    <div class="flex gap-2 mb-4">
      <button class="type-tab active text-xs px-4 py-1.5 rounded-full border border-[#2D5A3D] bg-[#2D5A3D] text-white font-medium" data-type="all">全部</button>
      <button class="type-tab text-xs px-4 py-1.5 rounded-full border border-gray-200 text-gray-500 hover:border-[#2D5A3D]" data-type="product">产品分类</button>
      <button class="type-tab text-xs px-4 py-1.5 rounded-full border border-gray-200 text-gray-500 hover:border-[#2D5A3D]" data-type="article">文章分类</button>
    </div>

    <div class="bg-white rounded-2xl border border-gray-100 overflow-x-auto">
      <table class="w-full text-sm">
        <thead><tr class="border-b border-gray-100 text-left text-gray-400 text-xs uppercase tracking-wider">
          <th class="p-4 font-medium">分类名称</th><th class="p-4 font-medium">中文名称</th><th class="p-4 font-medium">封面</th><th class="p-4 font-medium">类型</th><th class="p-4 font-medium">父级</th><th class="p-4 font-medium">排序</th><th class="p-4 font-medium">操作</th>
        </tr></thead>
        <tbody id="categoryTable"></tbody>
      </table>
    </div>

    <!-- Editor Modal -->
    <div id="editorModal" class="fixed inset-0 bg-black/40 z-50 hidden flex items-start justify-center p-4 pt-16 overflow-y-auto" onclick="if(event.target===this)requestClose()">
      <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8" onclick="event.stopPropagation()">
        <div class="flex justify-between items-center mb-6"><h2 id="editorTitle" class="text-xl font-serif font-bold">新增分类</h2><button onclick="requestClose()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times text-xl"></i></button></div>
        <form id="categoryForm" class="grid gap-4">
          <div><label class="block text-xs font-medium text-gray-500 mb-1">分类名称</label><input id="edId" oninput="validateIdInput()" class="w-full px-3 py-2 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-[#2D5A3D]/30 outline-none" placeholder="例如: yoga-leggings"><p id="edIdError" class="field-error hidden"></p></div>
          <div><label class="block text-xs font-medium text-gray-500 mb-1">中文名称</label><input id="edName" class="w-full px-3 py-2 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-[#2D5A3D]/30 outline-none" placeholder="例如: 瑜伽紧身裤"><p id="edNameError" class="field-error hidden"></p></div>
          <div><label class="block text-xs font-medium text-gray-500 mb-1">类型</label>
            <select id="edType" onchange="onTypeChange()" class="w-full px-3 py-2 border border-gray-200 rounded-xl text-sm">
              <option value="product">产品分类</option>
              <option value="article">文章分类</option>
            </select>
          </div>
          <div><label class="block text-xs font-medium text-gray-500 mb-1">一级分类</label>
            <select id="edParent" class="w-full px-3 py-2 border border-gray-200 rounded-xl text-sm">
              <option value="">（顶级分类）</option>
            </select>
            <p id="edParentHint" class="text-[11px] text-gray-400 mt-1 hidden">该分类下已有子分类，不可再设为子分类。</p>
          </div>
          <div><label class="block text-xs font-medium text-gray-500 mb-1">封面图片</label>
            <div class="flex items-center gap-3">
              <img id="edImagePreview" class="w-12 h-12 rounded-lg border border-gray-100 hidden object-cover">
              <div id="edImagePlaceholder" class="w-12 h-12 rounded-lg border border-dashed border-gray-200 flex items-center justify-center text-gray-300"><i class="fas fa-image"></i></div>
              <button type="button" onclick="document.getElementById('edImageInput').click()" class="px-3 py-1.5 border border-gray-200 rounded-lg text-xs hover:border-[#2D5A3D] transition-colors"><i class="fas fa-upload mr-1"></i> 上传</button>
              <button type="button" onclick="openCatMediaPicker()" class="px-3 py-1.5 border border-gray-200 rounded-lg text-xs hover:bg-gray-50 transition-colors"><i class="fas fa-folder-open mr-1"></i> 媒体库</button>
              <button type="button" onclick="clearEdImage()" class="text-xs text-red-400 hover:text-red-600">清除</button>
            </div>
            <p class="text-gray-400 mt-2" style="font-size:12px">提示：上传或选择封面后将自动保存，无需点击「保存」。</p>
            <input type="hidden" id="edImage" value="">
            <input type="file" id="edImageInput" accept="image/*" class="hidden" onchange="uploadEdImage(this)">
          </div>
          <div class="flex gap-3 justify-end pt-4 border-t border-gray-100">
            <button type="button" onclick="requestClose()" class="px-6 py-2.5 border border-gray-200 rounded-xl text-sm">取消</button>
            <button type="submit" class="px-6 py-2.5 bg-[#2D5A3D] text-white rounded-xl text-sm font-semibold hover:bg-[#3E7B54]"><i class="fas fa-save mr-1"></i> 保存</button>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>

  <nav id="adminMobileNav"></nav>

<script>
  const API = '/api'; let token = localStorage.getItem('token');
  if (!token) window.location.href = '/admin/login.html';
  window.__API_BASE = API; window.__AUTH_TOKEN = token;
  document.getElementById('logoutBtn')?.addEventListener('click', e => { e.preventDefault(); localStorage.removeItem('token'); window.location.href = '/admin/login.html'; });

  async function api(path, opts = {}) {
    const res = await fetch(API + path, { ...opts, headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json', ...opts.headers } });
    if (res.status === 401) { localStorage.removeItem('token'); window.location.href = '/admin/login.html'; }
    return res;
  }

  let allCategories = [], editingId = null, filterType = 'all';

  function escape(str) { return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  async function loadCategories() {
    allCategories = await (await api('/categories')).json();
    renderTable();
  }

  function renderTable() {
    const data = filterType === 'all' ? allCategories : allCategories.filter(c => c.type === filterType);
    const typeNames = { product: '产品分类', article: '文章分类' };
    const parentName = id => { const p = allCategories.find(c => c.id === id); return p ? p.name : '—'; };
    const childrenOf = id => data.filter(c => (c.parent_id || '') === id);
    const tops = data.filter(c => (c.parent_id || '') === '');
    function rowHtml(c, isChild) {
      const indent = isChild ? ' style="padding-left:2.4rem"' : '';
      const prefix = isChild ? '<span class="text-gray-300 mr-1">↳</span>' : '';
      const parentLabel = (c.parent_id && c.parent_id !== '') ? escape(parentName(c.parent_id)) : '<span class="text-gray-300">—</span>';
      return `
      <tr class="border-b border-gray-50 hover:bg-gray-50/50">
        <td class="p-4 font-mono text-xs text-gray-500"${indent}>${prefix}${escape(c.id)}</td>
        <td class="p-4 font-medium">${escape(c.name)}</td>
        <td class="p-4">${c.image ? `<img src="${escape(c.image)}" class="w-10 h-10 rounded-lg object-cover border border-gray-100" onerror="this.style.display='none'">` : '<span class="text-gray-300"><i class="fas fa-image"></i></span>'}</td>
        <td class="p-4"><span class="bg-gray-100 text-xs px-2 py-0.5 rounded-full">${typeNames[c.type] || c.type}</span></td>
        <td class="p-4 text-gray-500 text-xs">${parentLabel}</td>
        <td class="p-4 text-gray-400 text-xs">${c.sort_order}</td>
        <td class="p-4"><button onclick="editCategory('${escape(c.id)}')" class="text-[#2D5A3D] hover:underline text-xs mr-3"><i class="fas fa-edit"></i> 编辑</button><button onclick="deleteCategory('${escape(c.id)}')" class="text-red-400 hover:text-red-600 text-xs"><i class="fas fa-trash"></i></button></td>
      </tr>`;
    }
    let html = '';
    tops.forEach(t => {
      html += rowHtml(t, false);
      childrenOf(t.id).forEach(ch => { html += rowHtml(ch, true); });
    });
    // Safety: any child whose parent is filtered out shows as a top-level row
    data.forEach(c => {
      if ((c.parent_id && c.parent_id !== '') && !data.find(p => p.id === c.parent_id)) {
        html += rowHtml(c, false);
      }
    });
    document.getElementById('categoryTable').innerHTML = html;
  }

  // --- Parent category selector (方案C: two-level hierarchy) ---
  function populateParentOptions() {
    const type = document.getElementById('edType').value;
    const sel = document.getElementById('edParent');
    if (!sel) return;
    const tops = allCategories.filter(c => (c.parent_id || '') === '' && c.type === type && c.id !== editingId);
    sel.innerHTML = '<option value="">（顶级分类）</option>' + tops.map(c => `<option value="${escape(c.id)}">${escape(c.name)}</option>`).join('');
  }

  function onTypeChange() {
    populateParentOptions();
  }

  function openEditor(cat) {
    editingId = cat ? cat.id : null;
    clearEditorErrors();
    document.getElementById('editorTitle').textContent = cat ? '编辑: ' + cat.name : '新增分类';
    document.getElementById('edId').value = cat ? cat.id : '';
    document.getElementById('edId').disabled = !!cat;
    document.getElementById('edName').value = cat ? cat.name : '';
    document.getElementById('edType').value = cat ? cat.type : 'product';
    populateParentOptions();
    const edParent = document.getElementById('edParent');
    const edParentHint = document.getElementById('edParentHint');
    if (cat) {
      const hasChildren = allCategories.some(c => (c.parent_id || '') === cat.id);
      edParent.value = cat.parent_id || '';
      edParent.disabled = hasChildren;
      if (edParentHint) edParentHint.classList.toggle('hidden', !hasChildren);
    } else {
      edParent.value = '';
      edParent.disabled = false;
      if (edParentHint) edParentHint.classList.add('hidden');
    }
    document.getElementById('edImage').value = cat ? (cat.image || '') : '';
    updateEdImagePreview(cat ? cat.image : '');
    captureEditorSnapshot();
    document.getElementById('editorModal').classList.remove('hidden');
  }

  function updateEdImagePreview(url) {
    const img = document.getElementById('edImagePreview');
    const placeholder = document.getElementById('edImagePlaceholder');
    if (url) {
      img.src = url; img.classList.remove('hidden');
      placeholder.classList.add('hidden');
    } else {
      img.classList.add('hidden');
      placeholder.classList.remove('hidden');
    }
  }

  // --- Category ID validation (scheme B) ---
  // Allowed chars: lowercase a-z, digits, hyphen. No leading/trailing/consecutive hyphen.
  function validateCategoryId(id) {
    if (!id) return null; // empty handled by caller
    if (!/^[a-z0-9-]+$/.test(id)) {
      return '分类 ID 仅支持英文小写字母、数字和短横线（-），不能包含空格、中文、大写字母或 / 等符号';
    }
    if (/^-|-$|--/.test(id)) {
      return '分类 ID 不能以短横线开头或结尾，也不能有连续短横线';
    }
    return null;
  }

  // Show/hide an inline error under an input. Pass msg=null to clear.
  function setFieldError(inputId, errId, msg) {
    const input = document.getElementById(inputId);
    const err = document.getElementById(errId);
    if (msg) {
      if (err) { err.textContent = msg; err.classList.remove('hidden'); }
      if (input) input.classList.add('input-error');
    } else {
      if (err) { err.textContent = ''; err.classList.add('hidden'); }
      if (input) input.classList.remove('input-error');
    }
  }

  // Real-time validation while typing in the ID field (new category only; edit mode is disabled)
  function validateIdInput() {
    const id = document.getElementById('edId').value.trim();
    setFieldError('edId', 'edIdError', validateCategoryId(id));
  }

  function clearEditorErrors() {
    setFieldError('edId', 'edIdError', null);
    setFieldError('edName', 'edNameError', null);
  }

  function clearEdImage() {
    document.getElementById('edImage').value = '';
    document.getElementById('edImageInput').value = '';
    updateEdImagePreview('');
    if (editingId) saveCategorySilent();
  }

  function openCatMediaPicker() {
    window.__mediaPickCallback = async function(url) {
      document.getElementById('edImage').value = url;
      updateEdImagePreview(url);
      if (editingId) {
        await saveCategorySilent();
      } else {
        await ensureCategoryExists();
      }
    };
    openSharedMediaPicker();
  }

  async function uploadEdImage(input) {
    if (!input.files || !input.files[0]) return;
    const formData = new FormData();
    formData.append('file', input.files[0]);
    formData.append('folder', 'site');
    try {
      const res = await fetch(API + '/upload', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token },
        body: formData
      });
      if (!res.ok) throw new Error('Upload failed');
      const data = await res.json();
      document.getElementById('edImage').value = data.url;
      updateEdImagePreview(data.url);
      // Auto-save: for existing category just update; for new category create it with the image
      if (editingId) {
        await saveCategorySilent();
      } else {
        await ensureCategoryExists();
      }
    } catch(e) {
      alert('上传失败: ' + e.message);
    }
  }

  // Build safe category API URL — IDs containing '/' break Express path params
  function categoryUrl(id, method) {
    if (!id || !/[\/\?#]/.test(id)) return '/categories/' + id;
    // Use query-param fallback routes for IDs with special characters
    return (method === 'DELETE') ? '/categories/remove?id=' + encodeURIComponent(id) : '/categories/update?id=' + encodeURIComponent(id);
  }

  async function saveCategorySilent() {
    var data = {
      id: document.getElementById('edId').value.trim(),
      name: document.getElementById('edName').value.trim(),
      type: document.getElementById('edType').value,
      image: document.getElementById('edImage').value,
      parent_id: document.getElementById('edParent').value || '',
    };
    if (!data.id || !data.name) return;
    try {
      await api(categoryUrl(editingId, 'PUT'), { method: 'PUT', body: JSON.stringify(data) });
    } catch(e) { console.error('Auto-save failed:', e); }
  }

  // For a new (not-yet-saved) category: create it on first image action so the image persists,
  // then flip the modal into edit mode so subsequent changes auto-save.
  async function ensureCategoryExists() {
    if (editingId) return true;
    const id = document.getElementById('edId').value.trim();
    const name = document.getElementById('edName').value.trim();
    if (!id || !name) {
      // Cannot create without id/name yet — keep image locally, it will be saved on explicit submit
      return false;
    }
    // Enforce valid ID format for new categories (legacy categories with '/' keep working on edit)
    const idErr = validateCategoryId(id);
    if (idErr) { setFieldError('edId', 'edIdError', idErr); return false; }
    try {
      const res = await api('/categories', { method: 'POST', body: JSON.stringify({
        id, name, type: document.getElementById('edType').value, image: document.getElementById('edImage').value, parent_id: document.getElementById('edParent').value || ''
      })});
      if (res.ok) {
        const d = await res.json();
        editingId = (d && d.id) || id;
        document.getElementById('editorTitle').textContent = '编辑: ' + name;
        document.getElementById('edId').disabled = true;
        loadCategories();
        return true;
      }
    } catch(e) { console.error('Auto-create failed:', e); }
    return false;
  }

  let editorSnapshot = null;
  function captureEditorSnapshot() {
    editorSnapshot = {
      id: document.getElementById('edId').value,
      name: document.getElementById('edName').value,
      type: document.getElementById('edType').value,
      parent: document.getElementById('edParent').value,
      image: document.getElementById('edImage').value,
    };
  }
  function isEditorDirty() {
    if (!editorSnapshot) return false;
    return editorSnapshot.id !== document.getElementById('edId').value
      || editorSnapshot.name !== document.getElementById('edName').value
      || editorSnapshot.type !== document.getElementById('edType').value
      || editorSnapshot.parent !== document.getElementById('edParent').value
      || editorSnapshot.image !== document.getElementById('edImage').value;
  }
  function requestClose() {
    if (isEditorDirty() && !confirm('您有未保存的修改，确定要放弃吗？')) return;
    closeEditor();
  }

  function closeEditor() {
    document.getElementById('editorModal').classList.add('hidden');
    editingId = null;
    document.getElementById('edId').disabled = false;
    editorSnapshot = null;
  }

  document.getElementById('categoryForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    clearEditorErrors();
    const data = {
      id: document.getElementById('edId').value.trim(),
      name: document.getElementById('edName').value.trim(),
      type: document.getElementById('edType').value,
      image: document.getElementById('edImage').value,
      parent_id: document.getElementById('edParent').value || '',
    };
    if (!data.id) { setFieldError('edId', 'edIdError', '请填写分类名称'); return; }
    if (!data.name) { setFieldError('edName', 'edNameError', '请填写中文名称'); return; }
    // New category: enforce ID format. Existing categories (may contain legacy chars like '/') are kept as-is.
    if (!editingId) {
      const idErr = validateCategoryId(data.id);
      if (idErr) { setFieldError('edId', 'edIdError', idErr); return; }
    }
    try {
      if (editingId) { await api(categoryUrl(editingId, 'PUT'), { method: 'PUT', body: JSON.stringify(data) }); }
      else { await api('/categories', { method: 'POST', body: JSON.stringify(data) }); }
      closeEditor(); loadCategories();
    } catch(e) { alert('操作失败: ' + e.message); }
  });

  function editCategory(id) { const c = allCategories.find(x => x.id === id); if (c) openEditor(c); }

  async function deleteCategory(id) {
    if (!confirm('确认删除此分类？\n注意：删除分类不会删除该分类下的产品/文章。')) return;
    try { await api(categoryUrl(id, 'DELETE'), { method: 'DELETE' }); loadCategories(); }
    catch(e) { alert('删除失败: ' + e.message); }
  }

  // Type filter tabs
  document.querySelectorAll('.type-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.type-tab').forEach(b => {
        b.classList.remove('active', 'bg-[#2D5A3D]', 'text-white', 'border-[#2D5A3D]');
        b.classList.add('border-gray-200', 'text-gray-500');
      });
      btn.classList.add('active', 'bg-[#2D5A3D]', 'text-white', 'border-[#2D5A3D]');
      btn.classList.remove('border-gray-200', 'text-gray-500');
      filterType = btn.dataset.type;
      renderTable();
    });
  });

  loadCategories();
</script>
</body>
</html>
