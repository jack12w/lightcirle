<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>报价线索 — lightcirle 管理后台</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/tailwind.css">
  <link rel="stylesheet" href="/admin/css/admin-sidebar.css">
  <script defer src="/admin/js/admin-sidebar.js"></script>
</head>
<body class="bg-[#FAFAF8]">
<div class="flex min-h-screen">
  <!-- Sidebar：菜单由 admin/js/admin-sidebar.js 注入，单一数据源 -->
  <aside id="adminSidebar">
    <div class="sb-brand"><a href="dashboard.html">lightcirle</a><p>管理后台</p></div>
    <nav id="adminNav" class="sb-nav"></nav>
    <div class="sb-foot">
      <a href="#" id="logoutBtn" class="sb-link logout"><i class="fas fa-sign-out-alt w-5"></i>退出登录</a>
    </div>
  </aside>

  <main id="adminMain" class="flex-1 p-6 lg:p-8">
    <h1 class="text-2xl font-serif font-bold">报价线索</h1>
    <p class="text-sm text-gray-400 mb-8">来自官网「Get a Quote」向导的客户询价，可在后台跟进状态。</p>

    <div class="flex flex-wrap gap-3 mb-5" id="stats"></div>

    <div class="flex flex-wrap gap-3 items-center mb-6">
      <input type="text" id="searchInput" class="flex-1 min-w-[240px] px-4 py-2.5 border border-gray-200 rounded-xl text-sm bg-white text-gray-700 outline-none focus:border-[#2D5A3D] transition" placeholder="搜索 公司 / 联系人 / 邮箱 / 电话 / 备注…">
      <button id="exportBtn" class="inline-flex items-center gap-2 px-4 py-2.5 bg-[#2D5A3D] text-white rounded-xl text-sm font-medium hover:bg-[#1F3F2A] transition cursor-pointer"><i class="fas fa-download"></i> 导出 CSV</button>
    </div>

    <div class="flex flex-wrap gap-2 mb-4" id="filterBar"></div>

    <div class="bg-white rounded-2xl border border-gray-100 overflow-hidden">
      <table class="w-full text-sm">
        <thead>
          <tr>
            <th class="text-left py-3.5 px-4 text-xs font-medium text-gray-400 uppercase tracking-wide border-b border-gray-100">公司 / 联系人</th>
            <th class="text-left py-3.5 px-4 text-xs font-medium text-gray-400 uppercase tracking-wide border-b border-gray-100">联系方式</th>
            <th class="text-left py-3.5 px-4 text-xs font-medium text-gray-400 uppercase tracking-wide border-b border-gray-100">品类</th>
            <th class="text-left py-3.5 px-4 text-xs font-medium text-gray-400 uppercase tracking-wide border-b border-gray-100">数量</th>
            <th class="text-left py-3.5 px-4 text-xs font-medium text-gray-400 uppercase tracking-wide border-b border-gray-100">颜色</th>
            <th class="text-left py-3.5 px-4 text-xs font-medium text-gray-400 uppercase tracking-wide border-b border-gray-100">状态</th>
            <th class="text-left py-3.5 px-4 text-xs font-medium text-gray-400 uppercase tracking-wide border-b border-gray-100">需求详情</th>
            <th class="text-left py-3.5 px-4 text-xs font-medium text-gray-400 uppercase tracking-wide border-b border-gray-100">提交时间</th>
          </tr>
        </thead>
        <tbody id="quoteTable"></tbody>
      </table>
      <div class="empty p-12 text-center text-gray-400 text-sm" id="emptyState" style="display:none">暂无线索</div>
    </div>
  </main>
  <nav id="adminMobileNav"></nav>
</div>

<script>
  const API = '/api';
  const token = localStorage.getItem('token');
  if (!token) window.location.href = '/admin/login.html';
  document.getElementById('logoutBtn').addEventListener('click', e => {
    e.preventDefault(); localStorage.removeItem('token'); window.location.href = '/admin/login.html';
  });

  async function api(path, opts = {}) {
    const res = await fetch(API + path, {
      ...opts,
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json', ...(opts.headers || {}) }
    });
    if (res.status === 401) { localStorage.removeItem('token'); window.location.href = '/admin/login.html'; }
    return res;
  }

  const STATUS_LABELS = { new: '新线索', contacted: '已联系', quoted: '已报价', won: '已成交', lost: '已放弃' };
  const STATUS_ORDER = ['new', 'contacted', 'quoted', 'won', 'lost'];
  let quotes = [], activeFilter = 'all', searchQuery = '';

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  function renderStats() {
    const counts = { all: quotes.length };
    STATUS_ORDER.forEach(s => counts[s] = quotes.filter(q => q.status === s).length);
    const el = document.getElementById('stats');
    el.innerHTML = STATUS_ORDER.map(s =>
      `<div class="bg-white border border-gray-200 rounded-2xl px-5 py-4 min-w-[120px]"><div class="text-[22px] font-bold text-[#2D5A3D] leading-none">${counts[s]}</div><div class="text-xs text-gray-400 mt-1">${STATUS_LABELS[s]}</div></div>`
    ).join('');
  }

  function renderFilters() {
    const bar = document.getElementById('filterBar');
    const opts = [{ k: 'all', l: '全部' }].concat(STATUS_ORDER.map(s => ({ k: s, l: STATUS_LABELS[s] })));
    bar.innerHTML = opts.map(o => {
      const active = activeFilter === o.k;
      const cls = active ? 'bg-[#2D5A3D] text-white border-[#2D5A3D]' : 'bg-white text-gray-500 border-gray-200 hover:border-[#2D5A3D]';
      return `<button class="px-4 py-1.5 rounded-full border text-xs font-medium transition ${cls}" data-k="${o.k}">${o.l}</button>`;
    }).join('');
    bar.querySelectorAll('.filter-btn').forEach(b => {
      b.onclick = () => { activeFilter = b.dataset.k; renderFilters(); renderTable(); };
    });
  }

  // Combined filter: status + free-text search
  function getVisible() {
    const q = searchQuery.trim().toLowerCase();
    let data = activeFilter === 'all' ? quotes : quotes.filter(x => x.status === activeFilter);
    if (q) {
      data = data.filter(x => [x.company, x.name, x.email, x.whatsapp, x.notes, x.category, x.fabric, x.budget, x.product]
        .some(f => (f || '').toLowerCase().includes(q)));
    }
    return data;
  }

  function renderTable() {
    const BADGE = { new:'bg-blue-50 text-blue-600', contacted:'bg-amber-50 text-amber-600', quoted:'bg-purple-50 text-purple-600', won:'bg-green-50 text-green-600', lost:'bg-red-50 text-red-600' };
    const data = getVisible();
    const tbody = document.getElementById('quoteTable');
    const empty = document.getElementById('emptyState');
    if (!data.length) { tbody.innerHTML = ''; empty.style.display = 'block'; return; }
    empty.style.display = 'none';
    tbody.innerHTML = data.map(q => {
      const contact = esc(q.name) + (q.email ? `<div class="text-xs text-gray-400">${esc(q.email)}</div>` : '') + (q.whatsapp ? `<div class="text-xs text-gray-400">${esc(q.whatsapp)}</div>` : '');
      const color = (q.colorHex ? `<span class="inline-block w-3.5 h-3.5 rounded-full border border-gray-300 align-middle mr-1.5" style="background:${esc(q.colorHex)}"></span>` : '') + esc(q.color || '');
      const custom = (q.customization && q.customization.length) ? `<div class="text-xs text-gray-400">定制: ${esc(q.customization.join('，'))}</div>` : '';
      const detail = [
        q.product ? `<div><strong>产品: ${esc(q.product)}</strong></div>` : '',
        q.fabric ? `<div>面料: ${esc(q.fabric)}</div>` : '',
        q.delivery ? `<div>交期: ${esc(q.delivery)}</div>` : '',
        q.budget ? `<div>预算: ${esc(q.budget)}</div>` : '',
        custom,
        q.notes ? `<div class="text-xs text-gray-400 mt-1 whitespace-pre-wrap">${esc(q.notes)}</div>` : ''
      ].join('');
      const options = STATUS_ORDER.map(s => `<option value="${s}" ${q.status === s ? 'selected' : ''}>${STATUS_LABELS[s]}</option>`).join('');
      return `<tr>
        <td><div class="font-semibold">${esc(q.company || '—')}</div></td>
        <td>${contact}</td>
        <td><span class="inline-block px-2.5 py-0.5 rounded-full text-xs bg-gray-100 text-gray-600">${esc(q.category || '—')}</span></td>
        <td>${esc(q.qty ? q.qty + ' pcs' : '—')}</td>
        <td>${color || '—'}</td>
        <td><span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold ${BADGE[q.status] || 'bg-gray-100 text-gray-600'}">${STATUS_LABELS[q.status] || q.status}</span><br><select class="mt-1.5 px-2.5 py-1.5 rounded-lg border border-gray-200 text-xs bg-white text-gray-700 cursor-pointer outline-none focus:border-[#2D5A3D]" data-id="${q.id}">${options}</select></td>
        <td>${detail || '—'}</td>
        <td class="text-xs text-gray-400">${esc((q.createdAt || '').replace('T', ' '))}</td>
      </tr>`;
    }).join('');

    tbody.querySelectorAll('.status-sel').forEach(sel => {
      sel.addEventListener('change', async () => {
        const id = sel.dataset.id;
        try {
          const res = await api('/quotes/' + id, { method: 'PATCH', body: JSON.stringify({ status: sel.value }) });
          if (res.ok) {
            const q = quotes.find(x => String(x.id) === id);
            if (q) q.status = sel.value;
            renderStats(); renderTable();
          } else { alert('更新失败'); }
        } catch (e) { alert('更新失败: ' + e.message); }
      });
    });
  }

  function csvCell(v) {
    const s = String(v == null ? '' : v);
    return '"' + s.replace(/"/g, '""').replace(/\r\n|\r|\n/g, ' ') + '"';
  }

  function exportCsv() {
    const data = getVisible();
    if (!data.length) { alert('当前没有可导出的线索'); return; }
    const headers = ['ID', '公司', '联系人', '邮箱', 'WhatsApp', '品类', '数量', '颜色', '色值', '产品/款式', '面料/工艺', '定制项', '期望交期', '预算', '状态', '备注', '提交时间'];
    const rows = data.map(q => [
      q.id, q.company, q.name, q.email, q.whatsapp, q.category, q.qty,
      q.color, q.colorHex, q.product, q.fabric,
      (q.customization && q.customization.length) ? q.customization.join('，') : '',
      q.delivery, q.budget, STATUS_LABELS[q.status] || q.status, q.notes, q.createdAt
    ]);
    const csv = [headers.map(csvCell).join(','), ...rows.map(r => r.map(csvCell).join(','))].join('\r\n');
    const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0, 10);
    a.href = url; a.download = 'quote-leads-' + stamp + '.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  document.getElementById('searchInput').addEventListener('input', e => { searchQuery = e.target.value; renderTable(); });
  document.getElementById('exportBtn').addEventListener('click', exportCsv);

  async function load() {
    try {
      const res = await api('/quotes');
      quotes = res.ok ? await res.json() : [];
    } catch (e) { quotes = []; }
    renderStats(); renderFilters(); renderTable();
  }

  load();
</script>
</body>
</html>
